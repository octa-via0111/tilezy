<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Cream White Background -->
  <rect width="512" height="512" rx="112" fill="#FFF8EF"/>
  <rect x="14" y="14" width="484" height="484" rx="98" fill="none" stroke="#F0E6D8" stroke-width="4"/>

  <!-- Connecting Butter Yellow & Coral Beam -->
  <path d="M150 160 H 360 V 350 H 220" fill="none" stroke="#FFD66B" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)"/>
  <path d="M150 160 H 360 V 350 H 220" fill="none" stroke="#FF8B7B" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Nodes -->
  <circle cx="360" cy="160" r="16" fill="#FF8B7B" filter="url(#softGlow)"/>
  <circle cx="360" cy="160" r="8" fill="#FFF8EF"/>
  <circle cx="360" cy="350" r="16" fill="#FF8B7B" filter="url(#softGlow)"/>
  <circle cx="360" cy="350" r="8" fill="#FFF8EF"/>

  <!-- Tile 1 (Left Top) -->
  <g transform="translate(65, 80)">
    <rect y="12" width="165" height="165" rx="32" fill="#86BFAE"/>
    <rect width="165" height="165" rx="32" fill="#FFFFFF" stroke="#EAE3D9" stroke-width="4"/>
    <!-- Peppermint Candy -->
    <g transform="translate(18, 18) scale(2)">
      <polygon points="12,24 22,32 12,40 8,32" fill="#FFFFFF" stroke="#483D52" stroke-width="2.5"/>
      <polygon points="52,24 42,32 52,40 56,32" fill="#FFFFFF" stroke="#483D52" stroke-width="2.5"/>
      <circle cx="32" cy="32" r="16" fill="#FFFFFF" stroke="#483D52" stroke-width="3"/>
      <path d="M32 32 L32 16 A16 16 0 0 1 43 21 Z" fill="#FF8B7B"/>
      <path d="M32 32 L48 32 A16 16 0 0 1 43 43 Z" fill="#FF8B7B"/>
      <path d="M32 32 L32 48 A16 16 0 0 1 21 43 Z" fill="#FF8B7B"/>
      <path d="M32 32 L16 32 A16 16 0 0 1 21 21 Z" fill="#FF8B7B"/>
      <circle cx="32" cy="32" r="3" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- Tile 2 (Center Bottom) -->
  <g transform="translate(135, 270)">
    <rect y="12" width="165" height="165" rx="32" fill="#86BFAE"/>
    <rect width="165" height="165" rx="32" fill="#FFFFFF" stroke="#EAE3D9" stroke-width="4"/>
    <!-- Peppermint Candy (Matching pair) -->
    <g transform="translate(18, 18) scale(2)">
      <polygon points="12,24 22,32 12,40 8,32" fill="#FFFFFF" stroke="#483D52" stroke-width="2.5"/>
      <polygon points="52,24 42,32 52,40 56,32" fill="#FFFFFF" stroke="#483D52" stroke-width="2.5"/>
      <circle cx="32" cy="32" r="16" fill="#FFFFFF" stroke="#483D52" stroke-width="3"/>
      <path d="M32 32 L32 16 A16 16 0 0 1 43 21 Z" fill="#FF8B7B"/>
      <path d="M32 32 L48 32 A16 16 0 0 1 43 43 Z" fill="#FF8B7B"/>
      <path d="M32 32 L32 48 A16 16 0 0 1 21 43 Z" fill="#FF8B7B"/>
      <path d="M32 32 L16 32 A16 16 0 0 1 21 21 Z" fill="#FF8B7B"/>
      <circle cx="32" cy="32" r="3" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- Sparkles -->
  <polygon points="415,115 420,130 435,135 420,140 415,155 410,140 395,135 410,130" fill="#FFD66B"/>
  <polygon points="95,385 98,395 108,398 98,401 95,411 92,401 82,398 92,395" fill="#9CD9C8"/>
</svg>
